# Triển khai: cd worker && npx wrangler deploy
# Trước đó: npm run worker:prepare (chép docs/LIMITATIONS.md vào public/docs-LIMITATIONS.md)
# Secret: npx wrangler secret put ACCESS_TOKEN ; npx wrangler secret put KEY_GEMINI (k1,k2) ...
name = "ai-system-architect"
main = "index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[vars]
RATE_LIMIT_PER_MIN = "120"
